<script>
  /* thème appliqué avant le premier rendu : ni flash blanc, ni splash hors palette */
  try{
    var t = JSON.parse(localStorage.getItem('ometeo.theme') || 'null');
    var bgs = {
      'aether':'#00040C', 'lumon':'#16242D', 'black-sand':'#14181E',
      'tokyorain':'#0C0B0D', 'forest':'#1A2125', 'dusk':'#0E1720',
      'dawn':'#FBFDFF', 'paper':'#F6F1E7', 'mint':'#F1F5F2'
    };
    if (t && /^[a-z0-9-]+$/.test(t)) {
      document.documentElement.dataset.theme = t;
      if (bgs[t]) {
        document.documentElement.style.backgroundColor = bgs[t];
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bgs[t]);
      }
    }
    var f = JSON.parse(localStorage.getItem('ometeo.fs') || 'null');
    if (f === 'm' || f === 'l' || f === 'xl') document.documentElement.dataset.fs = f;
  }catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<body>

<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-in">
    <div class="splash-mark">ometeo<span>°</span></div>
    <div class="splash-rule"><i></i></div>
  </div>
</div>

<div class="app" id="app">

  <header class="bar">
    <button class="loc" id="locBtn" type="button" aria-label="Changer de lieu">
      <span class="dot" aria-hidden="true"></span>
      <span class="loc-name" id="placeName">—</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10l4 4 4-4"/></svg>
    </button>
    <div class="bar-r">
      <span class="clock" id="clock">--:--</span>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Affichage : thème et taille du texte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16Z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="unit" id="unitBtn" type="button" aria-label="Changer d'unité">°C</button>
      <button class="icon-btn" id="refreshBtn" type="button" aria-label="Actualiser">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="notice" id="notice" hidden>
    <span id="noticeText">Hors ligne</span>
    <button type="button" id="noticeBtn">Réessayer</button>
  </div>

  <main id="main">
    <section class="hero" id="hero" aria-live="polite"></section>
    <section class="block" id="hours"></section>
    <section class="block" id="days"></section>
    <section class="block" id="details"></section>
    <footer class="foot">
      <span class="foot-mark"><i aria-hidden="true"></i>OMETEO</span>
      <span id="footMeta">—</span>
    </footer>
  </main>

  <div class="install" id="install" role="region" aria-label="Installer l'application" hidden>
    <span class="install-ico" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 19h16"/></svg>
    </span>
    <span class="install-txt">
      <b>Installer ometeo</b>
      <span id="installHint">Plein écran, comme une app</span>
    </span>
    <button class="install-go" id="installGo" type="button">Installer</button>
    <button class="install-x" type="button" data-close-install aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-bg" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">Lieu</h2>
      <button class="icon-btn" type="button" data-close aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <label class="field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
      <input id="search" type="search" placeholder="Rechercher une ville" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    </label>
    <button class="geo" id="geoBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>
      Ma position
    </button>
    <ul class="results" id="results" aria-live="polite"></ul>
    <p class="sheet-note">Données Open-Meteo</p>
  </div>
</div>

<div class="sheet flat" id="themeSheet" aria-hidden="true">
  <div class="sheet-bg" data-close-theme></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="themeTitle">
    <div class="sheet-grab" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="themeTitle">Affichage</h2>
      <button class="icon-btn" type="button" data-close-theme aria-label="Fermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="themes" id="themeList"></ul>
    <div class="fs-row">
      <span class="fs-lbl">Taille</span>
      <div class="seg" id="fsSeg" role="group" aria-label="Taille du texte">
        <button type="button" data-fs-id="m" aria-label="Taille normale"><span class="a1">A</span></button>
        <button type="button" data-fs-id="l" aria-label="Grande taille"><span class="a2">A</span></button>
        <button type="button" data-fs-id="xl" aria-label="Très grande taille"><span class="a3">A</span></button>
      </div>
    </div>
    <p class="sheet-note">Palettes Omarchy · mémorisé sur cet appareil</p>
  </div>
</div>

<script src="app.js"></script>
</body>
